# The corpus `METHOD.md` names: each source, where it is fetched from and
# its SHA-256; and each input taken from it, by its path in the source, or
# by decompressing it whole, and its SHA-256. `filer-bench fetch` fetches
# them into `bench/corpus/`, never committed, and verifies each. What the
# reference encoders make of them, `filer-bench encode` records in
# `packed.toml`.

