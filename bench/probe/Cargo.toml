# The minimal `#![no_std]` program that the harness's `size` command builds,
# alone and with each decoder or algorithm of ours, to measure the code each
# adds (`METHOD.md`, item 7): a feature per decoder and per algorithm, at
# most one enabled at a time. Its own workspace, apart from the harness's.

[package]
name = "filer-bench-probe"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
compute-adler32 = { path = "../../lib/compute-adler32", default-features = false, optional = true }
compute-crc = { path = "../../lib/compute-crc", default-features = false, optional = true }
compute-fletcher = { path = "../../lib/compute-fletcher", default-features = false, optional = true }
compute-sha256 = { path = "../../lib/compute-sha256", default-features = false, optional = true }
compute-sha512 = { path = "../../lib/compute-sha512", default-features = false, optional = true }
compute-xxhash = { path = "../../lib/compute-xxhash", default-features = false, optional = true }
decode-bzip2 = { path = "../../lib/decode-bzip2", default-features = false, optional = true }
decode-deflate = { path = "../../lib/decode-deflate", default-features = false, optional = true }
decode-gzip = { path = "../../lib/decode-gzip", default-features = false, optional = true }
decode-lz4 = { path = "../../lib/decode-lz4", default-features = false, optional = true }
decode-lzma = { path = "../../lib/decode-lzma", default-features = false, optional = true }
decode-lzo = { path = "../../lib/decode-lzo", default-features = false, optional = true }
decode-xz = { path = "../../lib/decode-xz", default-features = false, optional = true }
decode-zlib = { path = "../../lib/decode-zlib", default-features = false, optional = true }
decode-zstd = { path = "../../lib/decode-zstd", default-features = false, optional = true }

[features]
# The decoders, with all they decode.
decode-bzip2 = ["dep:decode-bzip2", "decode-bzip2/all"]
decode-deflate = ["dep:decode-deflate", "decode-deflate/all"]
decode-gzip = ["dep:decode-gzip", "decode-gzip/all"]
decode-lz4 = ["dep:decode-lz4", "decode-lz4/all"]
decode-lzma = ["dep:decode-lzma", "decode-lzma/all"]
decode-lzo = ["dep:decode-lzo", "decode-lzo/all"]
decode-xz = ["dep:decode-xz", "decode-xz/all"]
decode-zlib = ["dep:decode-zlib", "decode-zlib/all"]
decode-zstd = ["dep:decode-zstd", "decode-zstd/all"]
# The algorithms, by the harness's names, each with its crate's feature.
crc16-modbus = ["dep:compute-crc", "compute-crc/crc16-modbus"]
crc32 = ["dep:compute-crc", "compute-crc/crc32"]
crc32c = ["dep:compute-crc", "compute-crc/crc32c"]
crc32-bzip2 = ["dep:compute-crc", "compute-crc/crc32-bzip2"]
crc64-xz = ["dep:compute-crc", "compute-crc/crc64-xz"]
adler32 = ["dep:compute-adler32"]
fletcher2 = ["dep:compute-fletcher", "compute-fletcher/fletcher2"]
fletcher4 = ["dep:compute-fletcher", "compute-fletcher/fletcher4"]
fletcher64 = ["dep:compute-fletcher", "compute-fletcher/fletcher64"]
sha256 = ["dep:compute-sha256"]
sha512 = ["dep:compute-sha512"]
sha512-256 = ["dep:compute-sha512"]
xxh32 = ["dep:compute-xxhash", "compute-xxhash/xxh32"]
xxh64 = ["dep:compute-xxhash", "compute-xxhash/xxh64"]

# The harness's release profile; `size` sets `opt-level` by
# `CARGO_PROFILE_RELEASE_OPT_LEVEL`.
[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

[workspace]
members = ["."]
