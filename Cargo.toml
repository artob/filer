# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["lib/*"]
default-members = ["lib/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
authors = ["Arto Bendiken"]
edition = "2024"
rust-version = "1.97"
description = "Filesystem API with platform-specific backends."
#documentation = "https://docs.rs/filer-api/"
readme = true
homepage = "https://github.com/artob/filer"
repository = "https://github.com/artob/filer"
license = "Unlicense"
keywords = []
categories = ["filesystem", "no-std"]
publish = true

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
must_use_candidate = "warn"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
filer-api = { version = "0.0.1", path = "lib/filer-api", default-features = false }
filer-heap = { version = "0.0.1", path = "lib/filer-heap", default-features = false }
filer-posix = { version = "0.0.1", path = "lib/filer-posix", default-features = false }
filer-spec = { version = "0.0.1", path = "lib/filer-spec", default-features = false }
filer-system = { version = "0.0.1", path = "lib/filer-system", default-features = false }
filer-tar = { version = "0.0.1", path = "lib/filer-tar", default-features = false }
filer-wasi = { version = "0.0.1", path = "lib/filer-wasi", default-features = false }
filer-whatwg = { version = "0.0.1", path = "lib/filer-whatwg", default-features = false }
filer-windows = { version = "0.0.1", path = "lib/filer-windows", default-features = false }
filer-zip = { version = "0.0.1", path = "lib/filer-zip", default-features = false }
bitflags = { version = "2.13", default-features = false }
ref-cast = { version = "1.0.27", default-features = false }
rustix = { version = "1.1", default-features = false }

[patch.crates-io]
filer-api = { path = "lib/filer-api" }
filer-heap = { path = "lib/filer-heap" }
filer-posix = { path = "lib/filer-posix" }
filer-spec = { path = "lib/filer-spec" }
filer-system = { path = "lib/filer-system" }
filer-tar = { path = "lib/filer-tar" }
filer-wasi = { path = "lib/filer-wasi" }
filer-whatwg = { path = "lib/filer-whatwg" }
filer-windows = { path = "lib/filer-windows" }
filer-zip = { path = "lib/filer-zip" }
