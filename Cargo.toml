# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["lib/*", "tmp/*"]
default-members = ["lib/*", "tmp/*"]
resolver = "3"

[workspace.package]
version = "0.0.4"
authors = ["Arto Bendiken"]
edition = "2024"
rust-version = "1.97"
description = "Filesystem API with platform-specific backends."
#documentation = "https://docs.rs/filer-api/"
readme = true
homepage = "https://github.com/artob/filer"
repository = "https://github.com/artob/filer"
license = "Unlicense"
keywords = ["public-domain"]
categories = ["filesystem", "no-std"]
publish = true

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
must_use_candidate = "warn"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
compute-adler32 = { version = "0.0.4", path = "lib/compute-adler32", default-features = false }
compute-crc = { version = "0.0.4", path = "lib/compute-crc", default-features = false }
compute-sha256 = { version = "0.0.4", path = "lib/compute-sha256", default-features = false }
compute-xxhash = { version = "0.0.4", path = "lib/compute-xxhash", default-features = false }
decode-deflate = { version = "0.0.4", path = "lib/decode-deflate", default-features = false }
decode-gzip = { version = "0.0.4", path = "lib/decode-gzip", default-features = false }
decode-lz4 = { version = "0.0.4", path = "lib/decode-lz4", default-features = false }
decode-lzo = { version = "0.0.4", path = "lib/decode-lzo", default-features = false }
decode-lzma = { version = "0.0.4", path = "lib/decode-lzma", default-features = false }
decode-xz = { version = "0.0.4", path = "lib/decode-xz", default-features = false }
decode-bzip2 = { version = "0.0.4", path = "lib/decode-bzip2", default-features = false }
decode-zlib = { version = "0.0.4", path = "lib/decode-zlib", default-features = false }
decode-zstd = { version = "0.0.4", path = "lib/decode-zstd", default-features = false }
filer-7z = { version = "0.0.4", path = "tmp/filer-7z", default-features = false }
