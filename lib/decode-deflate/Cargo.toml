[package]
name = "decode-deflate"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A clean-room, public-domain Deflate decoder, in safe Rust."
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["deflate", "zip", "inflate", "decoder", "public-domain"]
categories = ["compression", "no-std"]
publish.workspace = true
exclude = ["tests/fuzz.rs"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std", "intrinsics"]
all = ["deflate64"]
std = ["compute-multiversion?/std"]
deflate64 = []
# Its fast loop built for BMI2 too, on x86-64, and taken where the CPU has
# it: chosen at run time with `std`, else where the build enables it.
intrinsics = ["dep:compute-multiversion"]

# Only where `intrinsics` builds anything: x86-64 with SSE2, not soft-float
# targets (rust-lang/rust#117938) or others.
[target.'cfg(all(target_arch = "x86_64", target_feature = "sse2"))'.dependencies]
compute-multiversion = { workspace = true, optional = true }

[dev-dependencies]
# Mutates streams for `tests/fuzz.rs`. A path alone, without a version, so
# that publishing strips it; the fuzzer stays out of the package with it.
filer-spec = { path = "../filer-spec", default-features = false, features = ["std"] }
# Other decoders, which the tests check this one against.
deflate64.workspace = true
miniz_oxide = { workspace = true, features = ["with-alloc"] }
zlib-rs = { workspace = true, features = ["std"] }
