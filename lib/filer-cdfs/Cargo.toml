[package]
name = "filer-cdfs"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only ISO 9660 (CD-ROM) file system driver for the Filer API."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["iso9660", "iso", "cdrom", "filesystem", "public-domain"]
categories.workspace = true
publish.workspace = true
# The fixtures are images; tests run from the repository.
exclude = ["tests/fixtures/*.iso"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = ["zisofs"]
std = ["filer-api/std", "filer-fs/std", "filer-msft/std", "decode-zlib?/std"]
# Files that zisofs compresses, block by block, as zlib streams.
zisofs = ["dep:decode-zlib"]

[dependencies]
decode-zlib = { workspace = true, optional = true }
filer-api.workspace = true
filer-fs.workspace = true
filer-msft.workspace = true

[dev-dependencies]
filer-spec = { workspace = true, features = ["std"] }
filer-system = { workspace = true, features = ["std"] }

[[example]]
name = "cdfs-manifest"
required-features = ["std"]
