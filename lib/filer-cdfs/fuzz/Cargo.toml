# Coverage-guided fuzzing of `filer-cdfs` with `cargo-fuzz` (nightly):
# `cargo fuzz run descriptors`, `directories`, `joliet`, or `zisofs`, from
# `lib/filer-cdfs`. libFuzzer is C++, so this crate stays outside the
# workspace and is never a dependency of a published crate (DESIGN.md
# D50); `tests/fuzz.rs` is the pure-Rust fuzzer.

[package]
name = "filer-cdfs-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
filer-api = { path = "../../filer-api" }
filer-cdfs = { path = ".." }
filer-spec = { path = "../../filer-spec" }
libfuzzer-sys = "0.4"

# Its own workspace, apart from the repository's.
[workspace]
members = ["."]

[[bin]]
name = "descriptors"
path = "fuzz_targets/descriptors.rs"
test = false
doc = false
bench = false

[[bin]]
name = "directories"
path = "fuzz_targets/directories.rs"
test = false
doc = false
bench = false

[[bin]]
name = "joliet"
path = "fuzz_targets/joliet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zisofs"
path = "fuzz_targets/zisofs.rs"
test = false
doc = false
bench = false
