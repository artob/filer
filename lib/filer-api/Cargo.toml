[package]
name = "filer-api"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Platform-independent Filer API."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std", "intrinsics"]
all = []
std = ["compute-crc/std"]
# The CRCs of `checksum` by the CPU's instructions, where it has them
# (`compute-crc`'s): chosen at run time with `std`.
intrinsics = ["compute-crc/intrinsics"]

[dependencies]
bitflags.workspace = true
compute-crc = { workspace = true, features = ["crc16-modbus", "crc32", "crc32c"] }
ref-cast.workspace = true
