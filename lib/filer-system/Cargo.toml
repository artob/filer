[package]
name = "filer-system"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Cross-platform Filer API over the native filesystem driver."
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std", "intrinsics"]
all = []
std = [
  "dep:filer-posix",
  "dep:filer-wasi",
  "dep:filer-whatwg",
  "dep:filer-windows",
  "filer-api/std",
  "filer-posix/std",
  "filer-wasi/std",
  "filer-whatwg/std",
  "filer-windows/std",
]
# `filer-api`'s checksums by the CPU's instructions, where it has them (D66).
intrinsics = ["filer-api/intrinsics"]

[dependencies]
filer-api.workspace = true

# Each backend only under its `cfg`, and only with `std`, which `System`
# takes.
[target.'cfg(unix)'.dependencies]
filer-posix = { workspace = true, optional = true }

[target.'cfg(target_os = "wasi")'.dependencies]
filer-wasi = { workspace = true, optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
filer-whatwg = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
filer-windows = { workspace = true, optional = true }
