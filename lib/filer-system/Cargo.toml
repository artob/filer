[package]
name = "filer-system"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Cross-platform Filer API over the native filesystem driver."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = []
std = [
  "filer-api/std",
  "filer-posix/std",
  "filer-wasi/std",
  "filer-whatwg/std",
  "filer-windows/std",
]

[dependencies]
filer-api.workspace = true

[target.'cfg(unix)'.dependencies]
filer-posix.workspace = true

[target.'cfg(target_os = "wasi")'.dependencies]
filer-wasi.workspace = true

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
filer-whatwg.workspace = true

[target.'cfg(windows)'.dependencies]
filer-windows.workspace = true
