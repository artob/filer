[package]
name = "filer-posix"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "POSIX backend for the Filer API on Unix platforms."
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = []
std = ["dep:filer-api", "filer-api/std", "dep:rustix"]

# Only on Unix and with `std`, where the driver is.
[target.'cfg(unix)'.dependencies]
filer-api = { workspace = true, optional = true }
rustix = { workspace = true, optional = true, features = ["fs", "std"] }

[dev-dependencies]
filer-spec = { workspace = true, features = ["std"] }
