[package]
name = "decode-bzip2"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A clean-room, public-domain bzip2 decoder, in safe Rust."
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["bzip2", "bz2", "decompression", "decoder", "public-domain"]
categories = ["compression", "no-std"]
publish.workspace = true
exclude = ["tests/fuzz.rs"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = []
std = ["compute-crc/std"]

[dependencies]
compute-crc = { workspace = true, features = ["crc32-bzip2"] }

[dev-dependencies]
# Mutates streams for `tests/fuzz.rs`. A path alone, without a version, so
# that publishing strips it, and the crate depends on nothing; the fuzzer
# stays out of the package with it.
filer-spec = { path = "../filer-spec", default-features = false, features = ["std"] }
# Another decoder, which the tests check this one against: bzip2's own,
# ported to Rust as `libbz2-rs-sys`, the backend its defaults select.
bzip2 = { workspace = true }
