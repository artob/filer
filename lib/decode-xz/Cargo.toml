[package]
name = "decode-xz"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A clean-room, public-domain xz decoder, in safe Rust."
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["xz", "lzma2", "lzma", "decoder", "public-domain"]
categories = ["compression", "no-std"]
publish.workspace = true
exclude = ["tests/fuzz.rs"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = []
std = ["compute-crc/std", "compute-sha256/std", "decode-lzma/std"]

[dependencies]
compute-crc = { workspace = true, features = ["crc32", "crc64-xz"] }
compute-sha256.workspace = true
decode-lzma.workspace = true

[dev-dependencies]
# Mutates streams for `tests/fuzz.rs`. A path alone, without a version, so
# that publishing strips it; the fuzzer stays out of the package with it.
filer-spec = { path = "../filer-spec", default-features = false, features = ["std"] }
# Another decoder, which the tests check this one against, and the encoder
# of streams with filters.
lzma-rust2 = { workspace = true, features = ["encoder", "std", "xz"] }
