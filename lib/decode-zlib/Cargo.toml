[package]
name = "decode-zlib"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A clean-room, public-domain zlib decoder, in safe Rust."
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["zlib", "deflate", "inflate", "decoder", "public-domain"]
categories = ["compression", "no-std"]
publish.workspace = true
exclude = ["tests/fuzz.rs"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std", "intrinsics"]
all = []
std = ["compute-adler32/std", "decode-deflate/std"]
# Adler-32 by the CPU's vectors, where it has them (`compute-adler32`'s).
intrinsics = ["compute-adler32/intrinsics"]

[dependencies]
compute-adler32.workspace = true
decode-deflate.workspace = true

[dev-dependencies]
# Mutates streams for `tests/fuzz.rs`. A path alone, without a version, so
# that publishing strips it; the fuzzer stays out of the package with it.
filer-spec = { path = "../filer-spec", default-features = false, features = ["std"] }
# Deflates the tests' streams.
miniz_oxide = { workspace = true, features = ["with-alloc"] }
# Another decoder, which the tests check this one against.
zlib-rs = { workspace = true, features = ["std"] }
