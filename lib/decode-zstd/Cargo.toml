[package]
name = "decode-zstd"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A clean-room, public-domain zstd decoder, in safe Rust."
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["zstd", "zstandard", "decompression", "decoder", "no-std"]
categories = ["compression", "no-std"]
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = []
std = []

[dev-dependencies]
# Mutates streams for `tests/fuzz.rs`.
filer-spec = { workspace = true, features = ["std"] }
