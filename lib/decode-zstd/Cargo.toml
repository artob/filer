[package]
name = "decode-zstd"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A clean-room, public-domain zstd decoder, in safe Rust."
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["zstd", "zstandard", "decompression", "decoder", "public-domain"]
categories = ["compression", "no-std"]
publish.workspace = true
exclude = ["tests/fuzz.rs"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std", "intrinsics"]
all = []
std = ["compute-xxhash/std", "compute-multiversion?/std"]
# Its loops built for BMI2 and AVX2 too, on x86-64, and taken where the CPU
# has them: chosen at run time with `std`, else where the build enables
# them.
intrinsics = ["dep:compute-multiversion"]

[dependencies]
compute-multiversion = { workspace = true, optional = true }
compute-xxhash = { workspace = true, features = ["xxh64"] }

[dev-dependencies]
# Mutates streams for `tests/fuzz.rs`. A path alone, without a version, so
# that publishing strips it, and the crate depends on nothing; the fuzzer
# stays out of the package with it.
filer-spec = { path = "../filer-spec", default-features = false, features = ["std"] }
# Another decoder, which the tests check this one against.
ruzstd = { workspace = true, features = ["hash", "std"] }
