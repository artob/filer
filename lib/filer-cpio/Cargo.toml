[package]
name = "filer-cpio"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only cpio archive driver for the Filer API."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["cpio", "initramfs", "archive", "vfs", "public-domain"]
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = ["bzip2", "gzip", "xz", "zstd"]
std = ["filer-api/std", "filer-pack/std"]
bzip2 = ["filer-pack/bzip2"]
gzip = ["filer-pack/gzip"]
xz = ["filer-pack/xz"]
zstd = ["filer-pack/zstd"]

[dependencies]
filer-api.workspace = true
filer-pack.workspace = true

[dev-dependencies]
filer-spec = { workspace = true, features = ["std"] }
