[package]
name = "filer-volume"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only volumes of any supported file system for the Filer API."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["filesystem", "ext4", "ntfs", "vfs", "no-std"]
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = ["ext4", "fat", "ntfs", "udf", "xfs"]
std = [
  "filer-api/std",
  "filer-fs/std",
  "filer-ext4?/std",
  "filer-fat?/std",
  "filer-ntfs?/std",
  "filer-udf?/std",
  "filer-xfs?/std",
]
code-pages = ["fat", "filer-fat/code-pages"]
ext4 = ["dep:filer-ext4"]
fat = ["dep:filer-fat"]
ntfs = ["dep:filer-ntfs"]
udf = ["dep:filer-udf"]
xfs = ["dep:filer-xfs"]

[dependencies]
filer-api.workspace = true
filer-fs.workspace = true
filer-ext4 = { workspace = true, optional = true }
filer-fat = { workspace = true, optional = true }
filer-ntfs = { workspace = true, optional = true }
filer-udf = { workspace = true, optional = true }
filer-xfs = { workspace = true, optional = true }

[dev-dependencies]
filer-spec = { workspace = true, features = ["std"] }
