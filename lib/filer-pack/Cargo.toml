[package]
name = "filer-pack"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared machinery of archive drivers for the Filer API."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["archive", "unpack", "vfs", "no-std"]
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = ["deflate", "gzip", "zstd"]
std = ["filer-api/std"]
deflate = ["dep:miniz_oxide"]
gzip = ["deflate"]
zstd = ["dep:ruzstd"]

[dependencies]
filer-api.workspace = true
miniz_oxide = { workspace = true, optional = true, features = ["with-alloc"] }
ruzstd = { workspace = true, optional = true, features = ["hash"] }
spin = { workspace = true, features = ["spin_mutex"] }

[dev-dependencies]
filer-spec = { workspace = true, features = ["std"] }
# Writes the tests' gzip members, whatever the features.
miniz_oxide = { workspace = true, features = ["with-alloc"] }
