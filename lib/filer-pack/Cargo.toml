[package]
name = "filer-pack"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared machinery of archive drivers for the Filer API."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["archive", "unpack", "vfs", "public-domain"]
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std", "intrinsics"]
all = ["bzip2", "deflate", "deflate64", "gzip", "lzma", "xz", "zstd"]
std = [
  "filer-api/std",
  "decode-bzip2?/std",
  "decode-deflate?/std",
  "decode-gzip?/std",
  "decode-lzma?/std",
  "decode-xz?/std",
  "decode-zstd?/std",
]
# Checks by the CPU's instructions, where it has them: `filer-api`'s
# checksums, gzip's CRC-32, and xz's CRC-32 and SHA-256.
intrinsics = [
  "filer-api/intrinsics",
  "decode-gzip?/intrinsics",
  "decode-xz?/intrinsics",
]
bzip2 = ["dep:decode-bzip2"]
deflate = ["dep:decode-deflate"]
deflate64 = ["deflate", "decode-deflate/deflate64"]
gzip = ["dep:decode-gzip"]
lzma = ["dep:decode-lzma"]
xz = ["lzma", "dep:decode-xz"]
zstd = ["dep:decode-zstd"]

[dependencies]
decode-bzip2 = { workspace = true, optional = true }
decode-deflate = { workspace = true, optional = true }
decode-gzip = { workspace = true, optional = true }
decode-lzma = { workspace = true, optional = true }
decode-xz = { workspace = true, optional = true }
decode-zstd = { workspace = true, optional = true }
filer-api.workspace = true
spin = { workspace = true, features = ["spin_mutex"] }

[dev-dependencies]
filer-spec = { workspace = true, features = ["std"] }
# Writes the tests' gzip members, whatever the features.
miniz_oxide = { workspace = true, features = ["with-alloc"] }
