# Coverage-guided fuzzing of `filer-pack`'s decoders with `cargo-fuzz`
# (nightly): `cargo fuzz run gzip`, or `lzma`, `xz`, or `zstd`, from
# `lib/filer-pack`. libFuzzer is C++, so this crate stays outside the
# workspace and is never a dependency of a published crate (DESIGN.md
# D50); `tests/fuzz.rs` is the pure-Rust fuzzer.

[package]
name = "filer-pack-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
filer-api = { path = "../../filer-api" }
filer-pack = { path = ".." }
filer-spec = { path = "../../filer-spec" }
libfuzzer-sys = "0.4"
miniz_oxide = "0.9"

# Its own workspace, apart from the repository's.
[workspace]
members = ["."]

[[bin]]
name = "gzip"
path = "fuzz_targets/gzip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zstd"
path = "fuzz_targets/zstd.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xz"
path = "fuzz_targets/xz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lzma"
path = "fuzz_targets/lzma.rs"
test = false
doc = false
bench = false
