[package]
name = "filer-squashfs"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only SquashFS file system driver for the Filer API."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["squashfs", "appimage", "snap", "filesystem", "public-domain"]
categories.workspace = true
publish.workspace = true
# The fixtures are large; tests run from the repository.
exclude = ["tests/fixtures/*.sqfs"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std", "intrinsics"]
all = ["gzip", "lz4", "lzma", "lzo", "xz", "zstd"]
std = [
  "filer-api/std",
  "filer-fs/std",
  "decode-lz4?/std",
  "decode-lzma?/std",
  "decode-lzo?/std",
  "decode-xz?/std",
  "decode-zlib?/std",
  "decode-zstd?/std",
]
# Xz's checks by the CPU's instructions, where it has them (D66).
intrinsics = [
  "filer-api/intrinsics",
  "filer-fs/intrinsics",
  "decode-lzo?/intrinsics",
  "decode-xz?/intrinsics",
  "decode-zlib?/intrinsics",
]
# Each compressor `mksquashfs` offers, named as it names them.
gzip = ["dep:decode-zlib"]
lz4 = ["dep:decode-lz4"]
lzma = ["dep:decode-lzma"]
lzo = ["dep:decode-lzo"]
xz = ["dep:decode-xz"]
zstd = ["dep:decode-zstd"]

[dependencies]
decode-lz4 = { workspace = true, optional = true }
decode-lzma = { workspace = true, optional = true }
decode-lzo = { workspace = true, optional = true }
decode-xz = { workspace = true, optional = true }
decode-zlib = { workspace = true, optional = true }
decode-zstd = { workspace = true, optional = true }
filer-api.workspace = true
filer-fs.workspace = true

[dev-dependencies]
filer-spec = { workspace = true, features = ["std"] }
filer-system = { workspace = true, features = ["std"] }

[[example]]
name = "squashfs-manifest"
required-features = ["std"]
