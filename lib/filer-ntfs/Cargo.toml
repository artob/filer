[package]
name = "filer-ntfs"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only NTFS file system driver for the Filer API."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["ntfs", "windows", "filesystem", "mft", "no-std"]
categories.workspace = true
publish.workspace = true
# The fixtures are large; tests run from the repository.
exclude = ["tests/fixtures/*.sparse"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = []
std = ["filer-api/std"]

[dependencies]
filer-api.workspace = true

[dev-dependencies]
filer-spec = { workspace = true, features = ["std"] }
filer-system = { workspace = true, features = ["std"] }

[[example]]
name = "manifest"
required-features = ["std"]
