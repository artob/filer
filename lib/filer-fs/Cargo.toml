[package]
name = "filer-fs"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared machinery of on-disk file system drivers for the Filer API."
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["filesystem", "disk-image", "public-domain"]
categories.workspace = true
publish.workspace = true

# Tests run from the repository, with their fixtures.
exclude = ["tests/fixtures/*.sparse"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std", "intrinsics"]
all = []
std = ["filer-api/std"]
# `filer-api`'s checksums by the CPU's instructions, where it has them (D66).
intrinsics = ["filer-api/intrinsics"]

[dependencies]
filer-api.workspace = true
spin = { workspace = true, features = ["spin_mutex"] }

[dev-dependencies]
filer-spec = { workspace = true, features = ["std"] }
