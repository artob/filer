[package]
name = "filer-zip"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only ZIP archive driver for the Filer API."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["zip", "archive", "vfs", "zip-slip", "no-std"]
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = ["deflate"]
std = ["filer-api/std"]
deflate = ["dep:miniz_oxide"]

[dependencies]
filer-api.workspace = true
miniz_oxide = { workspace = true, optional = true, features = ["with-alloc"] }

[dev-dependencies]
filer-heap = { workspace = true, features = ["std"] }
miniz_oxide = { workspace = true, features = ["with-alloc"] }
filer-spec = { workspace = true, features = ["std"] }
