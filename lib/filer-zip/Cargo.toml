[package]
name = "filer-zip"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only ZIP archive driver for the Filer API."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["zip", "archive", "vfs", "zip-slip", "no-std"]
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = ["bzip2", "deflate", "lzma", "xz", "zstd"]
std = ["filer-api/std", "filer-msft/std", "filer-pack/std", "known-codepages/std"]
bzip2 = ["filer-pack/bzip2"]
code-pages = ["known-codepages/all"]
deflate = ["filer-pack/deflate"]
lzma = ["filer-pack/lzma"]
xz = ["filer-pack/xz"]
zstd = ["filer-pack/zstd"]

[dependencies]
filer-api.workspace = true
filer-msft.workspace = true
filer-pack.workspace = true
known-codepages.workspace = true

[dev-dependencies]
# Code page 866, as a test reads names in it.
known-codepages = { workspace = true, features = ["cp866"] }
filer-heap = { workspace = true, features = ["std"] }
miniz_oxide = { workspace = true, features = ["with-alloc"] }
filer-spec = { workspace = true, features = ["std"] }
