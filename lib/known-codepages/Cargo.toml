[package]
name = "known-codepages"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Single-byte DOS and Windows code pages, decoded by table."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["codepage", "cp437", "encoding", "oem", "no-std"]
categories = ["encoding", "no-std"]
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = [
    "cp720", "cp737", "cp775", "cp850", "cp852", "cp855", "cp857", "cp858",
    "cp860", "cp861", "cp862", "cp863", "cp864", "cp865", "cp866", "cp869",
    "cp874",
]
