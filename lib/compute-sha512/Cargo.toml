[package]
name = "compute-sha512"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A clean-room, public-domain SHA-512 and SHA-512/256, in safe Rust."
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["sha512", "sha2", "hash", "checksum", "public-domain"]
categories = ["algorithms", "no-std", "no-std::no-alloc"]
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std", "intrinsics"]
all = []
std = ["compute-multiversion?/std"]
# ARMv8.2's SHA-512 instructions, where the CPU has them: chosen at run time
# with `std`, else where the build enables them.
intrinsics = ["dep:compute-multiversion"]

# Only where `intrinsics` builds anything: x86-64 with SSE2 and aarch64 with
# NEON, not soft-float targets (rust-lang/rust#117938) or others.
[target.'cfg(any(all(target_arch = "x86_64", target_feature = "sse2"), all(target_arch = "aarch64", target_feature = "neon")))'.dependencies]
compute-multiversion = { workspace = true, optional = true }
