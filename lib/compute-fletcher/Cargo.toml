[package]
name = "compute-fletcher"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Clean-room, public-domain Fletcher checksums, as ZFS and APFS stamp them, in safe Rust."
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["fletcher", "checksum", "zfs", "apfs", "public-domain"]
categories = ["algorithms", "no-std", "no-std::no-alloc"]
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = ["fletcher2", "fletcher4", "fletcher64"]
std = []
fletcher2 = []
fletcher4 = []
fletcher64 = []
