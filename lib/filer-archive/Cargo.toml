[package]
name = "filer-archive"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only archives of any supported format for the Filer API."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["archive", "tar", "zip", "vfs", "no-std"]
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = [
  "7z",
  "ar",
  "bzip2",
  "cpio",
  "deflate",
  "gzip",
  "rar",
  "tar",
  "xz",
  "zip",
  "zstd",
]
std = [
  "filer-7z?/std",
  "filer-api/std",
  "filer-ar?/std",
  "filer-cpio?/std",
  "filer-pack/std",
  "filer-rar?/std",
  "filer-tar?/std",
  "filer-zip?/std",
]
7z = ["dep:filer-7z"]
ar = ["dep:filer-ar"]
bzip2 = ["filer-tar?/bzip2"]
cpio = ["dep:filer-cpio"]
deflate = ["zip", "filer-zip/deflate"]
gzip = ["filer-tar?/gzip"]
rar = ["dep:filer-rar"]
tar = ["dep:filer-tar"]
xz = ["filer-tar?/xz"]
zip = ["dep:filer-zip"]
zstd = ["filer-tar?/zstd"]

[dependencies]
filer-7z = { workspace = true, optional = true }
filer-api.workspace = true
filer-ar = { workspace = true, optional = true }
filer-cpio = { workspace = true, optional = true }
filer-pack.workspace = true
filer-rar = { workspace = true, optional = true }
filer-tar = { workspace = true, optional = true }
filer-zip = { workspace = true, optional = true }

[dev-dependencies]
filer-spec = { workspace = true, features = ["std"] }
