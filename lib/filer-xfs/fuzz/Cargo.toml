# Coverage-guided fuzzing of `filer-xfs` with `cargo-fuzz` (nightly):
# `cargo fuzz run superblock` from `lib/filer-xfs`. libFuzzer is C++, so
# this crate stays outside the workspace and is never a dependency of a
# published crate (DESIGN.md D50); `tests/fuzz.rs` is the pure-Rust fuzzer.

[package]
name = "filer-xfs-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
filer-api = { path = "../../filer-api" }
filer-spec = { path = "../../filer-spec" }
filer-xfs = { path = ".." }
libfuzzer-sys = "0.4"

# Its own workspace, apart from the repository's.
[workspace]
members = ["."]

[[bin]]
name = "superblock"
path = "fuzz_targets/superblock.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inodes"
path = "fuzz_targets/inodes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "directory"
path = "fuzz_targets/directory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "leaves"
path = "fuzz_targets/leaves.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log"
path = "fuzz_targets/log.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bmap"
path = "fuzz_targets/bmap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xattrs"
path = "fuzz_targets/xattrs.rs"
test = false
doc = false
bench = false
