[package]
name = "filer-xfs"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only XFS file system driver for the Filer API."
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["xfs", "linux", "filesystem", "public-domain"]
categories.workspace = true
publish.workspace = true

# The fixtures are large; tests run from the repository.
exclude = ["tests/fixtures/*.sparse"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std", "intrinsics"]
all = []
std = ["filer-api/std", "filer-fs/std"]
# Its metadata's CRC-32C by the CPU's instructions, where it has them (D66).
intrinsics = ["filer-api/intrinsics", "filer-fs/intrinsics"]

[dependencies]
filer-api.workspace = true
filer-fs.workspace = true

[dev-dependencies]
filer-spec = { workspace = true, features = ["std"] }
filer-system = { workspace = true, features = ["std"] }

[[example]]
name = "xfs-manifest"
required-features = ["std"]
