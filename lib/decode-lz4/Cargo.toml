[package]
name = "decode-lz4"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A clean-room, public-domain LZ4 decoder, in safe Rust."
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["lz4", "squashfs", "zfs", "decoder", "no-std"]
categories = ["compression", "no-std"]
publish.workspace = true
exclude = ["tests/fuzz.rs"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = []
std = ["compute-xxhash/std"]

[dependencies]
compute-xxhash = { workspace = true, features = ["xxh32"] }

[dev-dependencies]
# The tests' checksums of frames built by hand.
compute-xxhash = { workspace = true, features = ["xxh32"] }
# Mutates streams for `tests/fuzz.rs`. A path alone, without a version, so
# that publishing strips it; the fuzzer stays out of the package with it.
filer-spec = { path = "../filer-spec", default-features = false, features = ["std"] }
# Another decoder, which the tests check this one against, and an encoder.
lz4_flex = { workspace = true, features = ["frame", "safe-decode", "safe-encode", "std"] }
