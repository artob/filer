[package]
name = "compute-adler32"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A clean-room, public-domain Adler-32, in safe Rust."
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["adler32", "adler", "checksum", "zlib", "public-domain"]
categories = ["algorithms", "no-std", "no-std::no-alloc"]
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std", "intrinsics"]
all = []
std = ["compute-multiversion?/std"]
# The sums in the CPU's vectors, AVX2's and AVX-512's on x86-64 and NEON's
# on ARM, where it has them: chosen at run time with `std`, else where the
# build enables them.
intrinsics = ["dep:compute-multiversion"]

[dependencies]
compute-multiversion = { workspace = true, optional = true }
