[package]
name = "filer-whatwg"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "WHATWG File System Standard backend for the Filer API, for browsers (OPFS)."
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["opfs", "browser", "wasm", "file-system-access", "public-domain"]
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
# Its items are browser-only, so the default Linux build would be empty.
default-target = "wasm32-unknown-unknown"

[features]
default = ["all", "std"]
all = []
std = ["filer-api/std"]

[dependencies]
filer-api.workspace = true
