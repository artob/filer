[package]
name = "filer-udf"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only UDF file system driver for the Filer API."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["udf", "dvd", "blu-ray", "filesystem", "public-domain"]
categories.workspace = true
publish.workspace = true
# The fixtures are images; tests run from the repository.
exclude = ["tests/fixtures/*.sparse"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = []
std = ["filer-api/std", "filer-fs/std", "filer-msft/std"]

[dependencies]
filer-api.workspace = true
filer-fs.workspace = true
filer-msft.workspace = true

[dev-dependencies]
filer-spec = { workspace = true, features = ["std"] }
filer-system = { workspace = true, features = ["std"] }

[[example]]
name = "udf-manifest"
required-features = ["std"]
