[package]
name = "compute-crc"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Clean-room, public-domain CRCs: CRC-32, CRC-32C, CRC-64/XZ, and more, in safe Rust."
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["crc", "crc32", "crc32c", "checksum", "public-domain"]
categories = ["algorithms", "no-std", "no-std::no-alloc"]
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std", "intrinsics"]
all = ["crc16-modbus", "crc32", "crc32-bzip2", "crc32c", "crc64-xz"]
std = ["compute-multiversion?/std"]
# x86-64's carry-less multiplication and SSE4.2's `crc32`, and ARM's CRC
# instructions, where the CPU has them: chosen at run time with `std`, else
# where the build enables them.
intrinsics = ["dep:compute-multiversion"]
crc16-modbus = []
crc32 = []
crc32-bzip2 = []
crc32c = []
crc64-xz = []

[dependencies]
compute-multiversion = { workspace = true, optional = true }
