[package]
name = "compute-crc"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Clean-room, public-domain CRCs: CRC-32, CRC-32C, CRC-64/XZ, and more, in safe Rust."
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["crc", "crc32", "crc32c", "checksum", "public-domain"]
categories = ["algorithms", "no-std", "no-std::no-alloc"]
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std", "intrinsics"]
all = ["crc16-modbus", "crc32", "crc32-bzip2", "crc32c", "crc64-xz"]
std = ["compute-multiversion?/std"]
# Carry-less multiplication and the CRC instructions, x86-64's and ARM's,
# where the CPU has them: chosen at run time with `std`, else where the
# build enables them.
intrinsics = ["dep:compute-multiversion"]
crc16-modbus = []
crc32 = []
crc32-bzip2 = []
crc32c = []
crc64-xz = []

# Only where `intrinsics` builds anything: x86-64 with SSE2 and aarch64 with
# NEON, not soft-float targets (rust-lang/rust#117938) or others.
[target.'cfg(any(all(target_arch = "x86_64", target_feature = "sse2"), all(target_arch = "aarch64", target_feature = "neon")))'.dependencies]
compute-multiversion = { workspace = true, optional = true }
