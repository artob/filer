[package]
name = "compute-xxhash"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Clean-room, public-domain xxHash hashes: XXH64, in safe Rust."
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["xxhash", "xxh64", "hash", "checksum", "no-std"]
categories = ["algorithms", "no-std", "no-std::no-alloc"]
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = ["xxh64"]
std = []
xxh64 = []

[dev-dependencies]
# Another implementation, which the tests check this one against.
twox-hash = "2"
