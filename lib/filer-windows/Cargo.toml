[package]
name = "filer-windows"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Windows backend for the Filer API."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
# Every item is Windows-only, so the default Linux build would be empty.
default-target = "x86_64-pc-windows-msvc"

[features]
default = ["all", "std"]
all = []
std = ["filer-api/std", "filer-fs/std", "dep:windows-sys"]

[dependencies]
filer-api.workspace = true
filer-fs.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
filer-spec = { workspace = true, features = ["std"] }
