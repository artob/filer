[package]
name = "filer-windows"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Windows backend for the Filer API."
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
# Every item is Windows-only, so the default Linux build would be empty.
default-target = "x86_64-pc-windows-msvc"

[features]
default = ["all", "std"]
all = []
std = [
  "dep:filer-api",
  "dep:filer-fs",
  "dep:filer-msft",
  "dep:windows-sys",
  "filer-api/std",
  "filer-fs/std",
  "filer-msft/std",
]

# Only on Windows and with `std`, where the driver is.
[target.'cfg(windows)'.dependencies]
filer-api = { workspace = true, optional = true }
filer-fs = { workspace = true, optional = true }
filer-msft = { workspace = true, optional = true }
windows-sys = { workspace = true, optional = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
# For the directory listings' tests, which run on every target.
filer-fs = { workspace = true, features = ["std"] }
filer-msft = { workspace = true, features = ["std"] }
filer-spec = { workspace = true, features = ["std"] }
