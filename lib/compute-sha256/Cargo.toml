[package]
name = "compute-sha256"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A clean-room, public-domain SHA-256, in safe Rust."
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["sha256", "sha2", "hash", "checksum", "public-domain"]
categories = ["algorithms", "no-std", "no-std::no-alloc"]
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = []
std = ["compute-multiversion?/std"]
# SHA-256's instructions, x86-64's SHA extensions and ARMv8's SHA2, where the
# CPU has them: chosen at run time with `std`, else where the build enables
# them.
intrinsics = ["dep:compute-multiversion"]

[dependencies]
compute-multiversion = { workspace = true, optional = true }
